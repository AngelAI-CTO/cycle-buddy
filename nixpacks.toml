[phases.setup]
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
cmds = ["cd backend && python -m venv /opt/venv && /opt/venv/bin/pip install -r requirements.txt"]

[start]
cmd = "cd backend && /opt/venv/bin/gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
