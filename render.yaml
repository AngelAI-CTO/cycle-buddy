databases:
  - name: cycle-buddy-db
    plan: free
    databaseName: cycle_buddy
    user: cycle_buddy_user

services:
  - type: web
    name: cycle-buddy
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cycle-buddy-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: CORS_ORIGINS
        value: "*"
